events {
  worker_connections 4096;
}

http {
  upstream api_upstream {
    server api:3000;
  }

  server {
    listen 80;
    server_name corrientazo.example.com;

    # Redirección a HTTPS (TLS se configura con certificados reales en el VPS)
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name corrientazo.example.com;

    # Certificados (ejemplo con Let’s Encrypt)
    ssl_certificate     /etc/letsencrypt/live/corrientazo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corrientazo.example.com/privkey.pem;

    client_max_body_size 10m;

    # Headers de proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST
    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_http_version 1.1;
    }

    # Socket.io (websockets)
    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Namespace /realtime (si aplica)
    location /realtime/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}

